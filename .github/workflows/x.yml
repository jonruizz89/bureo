name: Publicar en X

# Cuentas de Limón en X por zona. Sin los secretos de una cuenta solo se escribe el texto en el registro (prueba).
# Horas en UTC: en invierno Madrid va una hora por delante (en verano, dos).
on:
  schedule:
    # GitHub a veces se salta o retrasa las tareas programadas: cada post tiene un segundo intento 30 min después,
    # que no hace nada si el primero ya publicó (marca del día en la caché de Actions)
    - cron: "17 6 * * *"    # ~7:17 · cortes y avisos del día
    - cron: "47 6 * * *"    #   segundo intento
    - cron: "37 10 * * *"   # ~11:37 · planes de hoy (de lunes a jueves; el finde ya lo cubre «finde»)
    - cron: "7 11 * * *"    #   segundo intento
    - cron: "13 17 * * 4"   # jueves ~18:13 · este finde
    - cron: "43 17 * * 4"   #   segundo intento
  workflow_dispatch:
    inputs:
      modo:
        description: "cortes, hoy, finde o yo (comprobar las credenciales sin publicar)"
        required: true
        default: cortes
      prueba:
        description: "1 = solo enseñar el texto, sin publicar"
        default: "1"

permissions:
  contents: read
  actions: write

jobs:
  post:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zona: [madrid]   # añadir aquí cada zona cuando tenga su cuenta y sus secretos X_<ZONA>_TOKEN / X_<ZONA>_SECRET
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Elegir qué toca
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            "17 6 * * *"|"47 6 * * *") m=cortes ;;
            "37 10 * * *"|"7 11 * * *") [ "$(date -u +%u)" -le 4 ] && m=hoy || m=none ;;
            "13 17 * * 4"|"43 17 * * 4") m=finde ;;
            *) m="${{ inputs.modo }}" ;;
          esac
          echo "modo=$m" >> "$GITHUB_OUTPUT"
          echo "dia=$(TZ=Europe/Madrid date +%F)" >> "$GITHUB_OUTPUT"
      - name: ¿Ya publicado hoy?
        id: hecho
        if: github.event_name == 'schedule' && steps.m.outputs.modo != 'none'
        uses: actions/cache/restore@v4
        with:
          path: engine/.x-hecho
          key: x-${{ matrix.zona }}-${{ steps.m.outputs.modo }}-${{ steps.m.outputs.dia }}
          lookup-only: true
      - name: Publicar
        if: steps.m.outputs.modo != 'none' && steps.hecho.outputs.cache-hit != 'true'
        env:
          TZ: Europe/Madrid
          X_DRY: ${{ inputs.prueba || '0' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_MADRID_TOKEN: ${{ secrets.X_MADRID_TOKEN }}
          X_MADRID_SECRET: ${{ secrets.X_MADRID_SECRET }}
        run: python3 src/x_post.py ${{ matrix.zona }} ${{ steps.m.outputs.modo }}
      - name: Marcar como publicado hoy
        if: github.event_name == 'schedule' && steps.m.outputs.modo != 'none' && steps.hecho.outputs.cache-hit != 'true' && success()
        run: echo ok > .x-hecho
      - if: github.event_name == 'schedule' && steps.m.outputs.modo != 'none' && steps.hecho.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: engine/.x-hecho
          key: x-${{ matrix.zona }}-${{ steps.m.outputs.modo }}-${{ steps.m.outputs.dia }}
