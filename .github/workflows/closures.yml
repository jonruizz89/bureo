name: Cortes de calle

on:
  schedule:
    - cron: "40 4 * * *"    # 06:40 en Madrid (verano)
    - cron: "40 13 * * *"   # 15:40 en Madrid (verano)
  workflow_dispatch:

concurrency:
  group: closures
  cancel-in-progress: false

jobs:
  closures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    env:
      BUREO_RAW: raw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recuperar la caché de avisos y mapas
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/raw/closures_cache.json
            engine/raw/geo_streets.json
            engine/raw/geo_metro.json
            engine/raw/osm_ways.json
          key: closures-${{ github.run_id }}
          restore-keys: closures-
      - name: Índices de calles y Metro (como mucho una vez por semana)
        run: mkdir -p raw && python3 src/geo_index.py
      - name: Leer avisos, extraer los cortes y su trazado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 src/closures.py
      - name: Guardar la caché de avisos y mapas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            engine/raw/closures_cache.json
            engine/raw/geo_streets.json
            engine/raw/geo_metro.json
            engine/raw/osm_ways.json
          key: closures-${{ github.run_id }}

  # resto de ciudades con fuente de calle (motor genérico): ayuntamientos de Bilbao, Vitoria-Gasteiz y Donostia (Tráfico Euskadi)
  otras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        city: [bilbao, vitoria, donostia]
    defaults:
      run:
        working-directory: engine/src/generic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Avisos de tráfico del ayuntamiento
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUREO_CITY_MAX_USD: "0.2"
        run: python3 calle.py ${{ matrix.city }}
