name: Cortes de calle

on:
  schedule:
    - cron: "40 4 * * *"    # 06:40 en Madrid (verano)
    - cron: "40 13 * * *"   # 15:40 en Madrid (verano)
  workflow_dispatch:

concurrency:
  group: closures
  cancel-in-progress: false

jobs:
  closures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    env:
      BUREO_RAW: raw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recuperar la caché de avisos
        uses: actions/cache/restore@v4
        with:
          path: engine/raw/closures_cache.json
          key: closures-${{ github.run_id }}
          restore-keys: closures-
      - name: Leer avisos del Ayuntamiento y extraer los cortes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: mkdir -p raw && python3 src/closures.py
      - name: Guardar la caché de avisos
        if: always()
        uses: actions/cache/save@v4
        with:
          path: engine/raw/closures_cache.json
          key: closures-${{ github.run_id }}
