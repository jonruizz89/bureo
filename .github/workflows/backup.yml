name: Copia de seguridad

# Cada domingo: copia completa de la base de datos (datos de la app y cuentas), comprimida y CIFRADA con una frase
# que solo tiene Jon. Se guarda 90 días como artefacto del flujo (el repositorio es público: sin la frase no sirve de nada).
# Secretos: SUPABASE_DB_PASSWORD (contraseña de la base de datos) y BACKUP_PASSPHRASE. También vale SUPABASE_DB_URL en lugar de la contraseña.
# Restaurar: ver «Copias de seguridad» en el README.
on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: pxeqbxxfsrvsxcdfiddc
      REGION: eu-central-1
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Comprobar los secretos
        run: |
          if { [ -z "$SUPABASE_DB_URL" ] && [ -z "$PGPASSWORD" ]; } || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltan los secretos SUPABASE_DB_PASSWORD y/o BACKUP_PASSPHRASE en GitHub"; exit 1; fi
      - name: Instalar pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Volcar, comprimir y cifrar
        run: |
          set -euo pipefail
          D=$(date -u +%Y-%m-%d); mkdir -p out; umask 077
          PGD=/usr/lib/postgresql/17/bin/pg_dump
          # lo normal: solo la contraseña; se busca el «session pooler» de la región (GitHub no tiene IPv6 para la conexión directa).
          # Si SUPABASE_DB_URL es una cadena postgresql:// completa se usa tal cual; si no, se trata como la contraseña.
          if [[ "${SUPABASE_DB_URL:-}" =~ ^postgres(ql)?://[^/]*@ ]]; then
            DB=("$SUPABASE_DB_URL"); echo "conexión: cadena completa"
          else
            export PGPASSWORD="${PGPASSWORD:-$SUPABASE_DB_URL}" PGUSER="postgres.$REF" PGPORT=5432 PGDATABASE=postgres PGSSLMODE=require
            for h in aws-0-$REGION.pooler.supabase.com aws-1-$REGION.pooler.supabase.com; do
              if out=$(PGHOST=$h PGCONNECT_TIMEOUT=10 /usr/lib/postgresql/17/bin/psql -tAc 'select 1' 2>&1); then export PGHOST=$h; break; fi
              echo "$h: $(echo "$out" | head -1 | sed 's/password[^ ]*/***/g')"
            done
            [ -n "${PGHOST:-}" ] || { echo "::error::No se ha podido conectar a la base de datos: revisa la contraseña (SUPABASE_DB_PASSWORD)"; exit 1; }
            echo "conectado por $PGHOST"; DB=()
          fi
          # 1) la app: esquema y datos del esquema public
          $PGD "${DB[@]}" -n public --no-owner --no-privileges -Fc -f app.dump
          # 2) las cuentas: solo datos de usuarios e identidades (el esquema auth lo crea Supabase)
          $PGD "${DB[@]}" --data-only -t auth.users -t auth.identities --no-owner --no-privileges -Fc -f cuentas.dump
          tar czf limon.tgz app.dump cuentas.dump
          echo "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "out/limon-$D.tgz.gpg" limon.tgz
          rm -f app.dump cuentas.dump limon.tgz
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: copia-${{ github.run_id }}
          path: out/*.gpg
          retention-days: 90
