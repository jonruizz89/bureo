name: Auditoría de cobertura

on:
  schedule:
    - cron: "30 5 * * 1"   # lunes, 07:30 en Madrid (verano)
  workflow_dispatch:
    inputs:
      groups:
        description: "Grupos a revisar (ids separados por comas; vacío = todos)"
        required: false
        default: ""
      debug:
        description: "Mostrar las respuestas de la IA"
        required: false
        default: ""

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar en la web lo que falta, por grupo de categorías
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUREO_AUDIT_GROUPS: ${{ inputs.groups }}
          BUREO_AUDIT_DEBUG: ${{ inputs.debug }}
        run: python3 src/audit.py
