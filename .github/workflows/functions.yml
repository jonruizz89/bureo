name: Funciones del servidor

# Publica en Supabase las funciones que cambian en supabase/functions/ (o todas, a mano).
# Necesita el secreto SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
    inputs:
      only:
        description: "Funciones a publicar, separadas por espacios (vacío = todas)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: pxeqbxxfsrvsxcdfiddc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Falta el secreto SUPABASE_ACCESS_TOKEN: no se publica nada."; exit 0; fi
          if [ -n "${{ inputs.only }}" ]; then fns="${{ inputs.only }}";
          elif [ "${{ github.event_name }}" = "push" ]; then fns=$(git diff --name-only HEAD~1 HEAD -- supabase/functions | cut -d/ -f3 | sort -u);
          else fns=$(ls supabase/functions); fi
          for f in $fns; do
            [ -f "supabase/functions/$f/index.ts" ] || continue
            echo "== $f"
            supabase functions deploy "$f" --project-ref "$PROJECT" --no-verify-jwt --use-api
          done
