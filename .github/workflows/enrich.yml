name: Completar descripciones

# Los eventos que llegan sin descripción se completan con el texto de su ficha original (la web de la fuente o del
# organizador) y se vuelven a clasificar con ese texto. Va después de las cargas nocturnas.
on:
  schedule:
    - cron: "13 2 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Fichas como mucho en esta ejecución"
        required: false
        default: "400"

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BUREO_ENRICH_MAX: ${{ inputs.max || '400' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer las fichas de los eventos sin descripción
        run: python3 src/enrich.py
      - name: Volver a clasificar los que ahora tienen texto
        run: python3 src/classify.py
